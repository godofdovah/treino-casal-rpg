name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar projeto Capacitor
        run: |
          mkdir -p build/www
          cp -r index.html img build/www/
          cd build
          npm init -y >/dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Treino RPG" com.godofdovah.treinorpg --web-dir www
          npx cap add android
          npx cap sync android

      - name: Icone do app
        run: |
          cd build/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
            dir=${d%%:*}; size=${d##*:}
            mkdir -p $dir
            rm -f $dir/ic_launcher*.png $dir/ic_launcher*.webp
            convert ../../../../../../android-extra/icon.png -filter point -resize ${size}x${size} $dir/ic_launcher.png
            cp $dir/ic_launcher.png $dir/ic_launcher_round.png
          done

      - name: Compilar APK
        run: |
          mkdir -p ~/.android
          cp android-extra/debug.keystore ~/.android/debug.keystore
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../treino-rpg.apk

      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk -y --cleanup-tag || true
          gh release create apk treino-rpg.apk --title "Treino RPG (APK)" --notes "Baixe o treino-rpg.apk no celular e instale." --latest
