name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar projeto Capacitor
        run: |
          mkdir -p build/www
          cp -r index.html img build/www/
          cd build
          npm init -y >/dev/null
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 capacitor-health@8
          cp node_modules/@capacitor/core/dist/capacitor.js www/
          npx cap init "Treino RPG" com.godofdovah.treinorpg --web-dir www
          rm -f capacitor.config.ts
          # o app abre a versão do GitHub Pages (atualiza sozinho); sem internet usa a cópia embutida
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.godofdovah.treinorpg",
            "appName": "Treino RPG",
            "webDir": "www",
            "server": { "url": "https://godofdovah.github.io/treino-casal-rpg/", "errorPath": "index.html" }
          }
          JSON
          npx cap add android
          python3 ../android-extra/patch_android.py android
          npx cap sync android

      - name: Icone do app
        run: |
          res=build/android/app/src/main/res
          rm -rf $res/mipmap-anydpi-v26
          rm -f $res/mipmap-*/ic_launcher*
          cp -r android-extra/res/* $res/

      - name: Compilar APK
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../treino-rpg.apk
          keytool -printcert -jarfile ../../treino-rpg.apk | grep -i sha256 | head -1 || true

      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk -y --cleanup-tag || true
          gh release create apk treino-rpg.apk --title "Treino RPG (APK)" --notes "Baixe o treino-rpg.apk no celular e instale." --latest
